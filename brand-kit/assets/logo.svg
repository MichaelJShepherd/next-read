<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d8a56"/>
      <stop offset="100%" stop-color="#1a6b3c"/>
    </linearGradient>
  </defs>

  <!-- Book icon with leaf -->
  <g transform="translate(150, 30)">
    <!-- Left page -->
    <path d="M50 20 Q50 10 40 10 L8 10 Q0 10 0 20 L0 110 Q0 118 8 118 L42 118 Q50 118 50 110 Z" fill="#2d8a56" opacity="0.85"/>
    <!-- Right page -->
    <path d="M50 20 Q50 10 60 10 L92 10 Q100 10 100 20 L100 110 Q100 118 92 118 L58 118 Q50 118 50 110 Z" fill="#1a6b3c" opacity="0.9"/>
    <!-- Spine highlight -->
    <line x1="50" y1="14" x2="50" y2="114" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <!-- Leaf/bookmark sprouting from book -->
    <g transform="translate(50, 0)">
      <path d="M0 18 Q-6 -10 8 -18 Q22 -10 16 18" fill="url(#leafGrad)" opacity="0.9"/>
      <path d="M0 18 Q4 -2 12 -14" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    </g>
    <!-- Page lines left -->
    <line x1="14" y1="38" x2="40" y2="38" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
    <line x1="14" y1="52" x2="38" y2="52" stroke="#ffffff" stroke-width="1.2" opacity="0.25"/>
    <line x1="14" y1="66" x2="36" y2="66" stroke="#ffffff" stroke-width="1.2" opacity="0.2"/>
    <!-- Page lines right -->
    <line x1="60" y1="38" x2="86" y2="38" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
    <line x1="62" y1="52" x2="86" y2="52" stroke="#ffffff" stroke-width="1.2" opacity="0.25"/>
    <line x1="64" y1="66" x2="86" y2="66" stroke="#ffffff" stroke-width="1.2" opacity="0.2"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="500" fill="#1a1a1a" letter-spacing="-1">next read</text>

  <!-- Tagline -->
  <text x="200" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#6b7280" letter-spacing="3">YOUR COZY LIBRARIAN</text>

  <!-- Decorative dot accent -->
  <circle cx="200" cy="260" r="3" fill="#2d8a56" opacity="0.6"/>
</svg>
